# 禁止語の検査を、fork から来た PR にも効かせる（branch protection の必須チェック「blocklist」）。
#
# なぜ別ファイルか: checks.yml は pull_request で動くが、GitHub は fork からの pull_request に
# Actions の secret を渡さない。BLOCKLIST が空になり、check_blocklist.py は「空なら失敗」なので
# メンバーの PR は中身に関係なく必ず赤になる。pull_request_target は main 側の定義で動き secret を使える。
#
# 🔴 pull_request_target の安全条件（崩さない）:
#   - 実行するのは main 側（base/）のスクリプトだけ。PR 側（pr/）は「読むデータ」としてしか扱わない
#     （PR の python・npm・シェルを一切実行しない。PR の hooks/ を呼ばない）
#   - PR 側の checkout は persist-credentials: false（トークンを .git に残さない）
#   - python は -I（隔離モード）で動かす。PR 側に置かれた .py を import させない
#   - permissions は読み取り（contents・pull-requests）だけ。書き込み権限を足さない（PR へのコメントもしない）
#   - PR の本文・タイトルを `${{ }}` で run に埋め込まない（本文はスクリプトがイベントの JSON から読む）
#   - このファイル自体の変更は main に入るまで効かない（PR が自分の検査を書き換えられない）
#
# 2026-11-13 追加: fork から Skill を足す・変える PR は、本文に配布前レビューの結果が無ければ赤にする
# （hooks/check_pr_review.py。本文の形の正本は plugins/hicard/skills/skill-submit/pr_body.md）。
# 本文を直したらやり直すため edited でも動かす。
name: blocklist
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: blocklist-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  blocklist:
    runs-on: ubuntu-latest
    steps:
      - name: main 側の検査スクリプトを取る（実行するのはこちらだけ）
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base
          persist-credentials: false
      - name: PR 側の中身を取る（データとして読むだけ）
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          # actions/checkout は pull_request_target での fork の checkout を既定で拒否する（2026-11-13 実測）。
          # ここでは PR 側を「読むだけ」で実行しないので明示的に許可する。下の安全条件を崩す変更は入れない
          allow-unsafe-pr-checkout: true
      - name: 禁止語（一覧は Actions secret の BLOCKLIST。ログには場所しか出さない）
        env:
          BLOCKLIST: ${{ secrets.BLOCKLIST }}
          TARGET: ${{ github.event_name == 'pull_request_target' && 'pr' || 'base' }}
        run: |
          cd "$TARGET"
          python3 -I "$GITHUB_WORKSPACE/base/hooks/check_blocklist.py"
      - name: 配布前レビューの結果が PR 本文にあるか（fork から Skill を変える PR だけ。機械の点検は Summary に出す）
        if: ${{ !cancelled() && github.event_name == 'pull_request_target' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_DIR: ${{ github.workspace }}/pr
        run: python3 -I "$GITHUB_WORKSPACE/base/hooks/check_pr_review.py"
