# PR ごとに走り、branch protection の必須チェック「checks」になる。落ちると main にマージできない。
# 3つは hooks/ の同じスクリプト（ローカル pre-push と同じ判定をサーバー側でもう一度やる）。
# 4つ目は公式の claude plugin validate --strict（plugin と marketplace の定義が壊れていないか）。
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 版の食い違い（marketplace.json と plugin.json）
        run: python3 hooks/check_versions.py
      - name: 鍵・置いてはいけないファイル（追跡中の全ファイル）
        run: python3 hooks/check_secrets.py --all
      - name: 禁止語（一覧は Actions secret の BLOCKLIST。ログには場所しか出さない）
        env:
          BLOCKLIST: ${{ secrets.BLOCKLIST }}
        run: python3 hooks/check_blocklist.py
      - name: plugin と marketplace の定義（公式 claude plugin validate --strict・ログイン不要）
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict plugins/hicard
          claude plugin validate --strict .
